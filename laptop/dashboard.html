<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip settings</title>
<link rel="icon" href="/logo/chip-dark.png">
<script>
  // the theme before the first paint: the one picked on this page, else the system's
  (() => {
    let t = null;
    try { t = localStorage.getItem("deskbuddy.theme"); } catch (e) { /* storage blocked */ }
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000; --side: #000; --panel: #0b0b0b; --sunk: #050505; --hover: #131313; --active: #1b1b1b;
  --line: #1d1d1d; --line2: #2e2e2e; --fg: #f3f3f3; --soft: #c9c9c9; --muted: #8e8e8e;
  --accent: #2ee6f2; --accent-soft: #0d3a3d; --track: #2e2e2e; --knob: #9a9a9a; --knob-on: #000;
  --good: #4ade80; --warn: #f5c04a; --warn-line: #5a4716; --bad: #ff6b6b; --bad-line: #5c2222; --shadow: rgba(0, 0, 0, .6);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f4; --side: #efefed; --panel: #fff; --sunk: #f5f5f4; --hover: #e6e6e3; --active: #dcdcd8;
  --line: #e6e6e3; --line2: #cfcfcb; --fg: #111; --soft: #333; --muted: #5f5f5f;
  --accent: #00737b; --accent-soft: #c9ecee; --track: #c8c8c4; --knob: #fff; --knob-on: #fff;
  --good: #15803d; --warn: #a16207; --warn-line: #e8d39a; --bad: #c62828; --bad-line: #efb4b4; --shadow: rgba(0, 0, 0, .18);
}
:root { --chip: #2ee6f2; --custom: #2ee6f2; --mono: ui-monospace, "Ubuntu Mono", "SF Mono", Menlo, Consolas, monospace; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; color: var(--fg); background: var(--bg); font: 15px/1.45 system-ui, "Ubuntu", "Cantarell", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
:root[data-theme="dark"] .only-light, :root[data-theme="light"] .only-dark { display: none !important; }

/* ---------- layout: the sidebar of topics and one page at a time */
.shell { display: flex; align-items: flex-start; min-height: 100vh; }
.side {
  position: sticky; top: 0; flex: none; width: 272px; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  padding: 20px 14px 16px; background: var(--side); border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--line2) transparent;
}
.brand { display: flex; align-items: center; gap: 14px; padding: 0 6px; color: inherit; text-decoration: none; }
.brand img { width: 70px; height: auto; display: block; }
.brand b { display: block; font-size: 15px; font-weight: 600; }
.brand small { display: block; font-size: 12.5px; color: var(--muted); }
.search { position: relative; display: block; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.field, .search input {
  width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--sunk);
  color: var(--fg); font-size: 14px; min-width: 0;
}
.search input { padding-left: 38px; background: var(--panel); }
::placeholder { color: var(--muted); opacity: 1; }
.navwrap { display: flex; flex-direction: column; gap: 12px; }
.navgrp { display: flex; flex-direction: column; gap: 2px; }
.navlabel { padding: 0 12px 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
.nav {
  display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 7px 12px; border-radius: 10px;
  color: var(--soft); text-decoration: none; font-size: 14.5px;
}
.nav svg { flex: none; }
.nav:hover { background: var(--hover); color: var(--fg); }
.nav[aria-current="page"] { background: var(--active); color: var(--fg); font-weight: 500; }
.nomatch { margin: 0; padding: 0 12px; font-size: 13.5px; color: var(--muted); }
.sidestatus { margin-top: auto; display: block; color: inherit; text-decoration: none; border-radius: 12px; }
.status { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
.sidestatus:hover .status { background: var(--hover); }
.status .dot { flex: none; width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: var(--muted); }
.status.on .dot { background: var(--good); }
.status b { display: block; font-weight: 500; font-size: 13.5px; }
.status span { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.status .sync.ok { color: var(--good); }
.status .sync.wait { color: var(--warn); }

.main { flex: 1; min-width: 0; padding: 0 40px; }
.topbar { display: flex; justify-content: flex-end; padding: 16px 0 0; }
.themebtn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 7px 16px 7px 13px; border-radius: 20px;
  border: 1px solid var(--line2); background: transparent; font-size: 14px;
}
.themebtn:hover { border-color: var(--muted); }
.page { max-width: 760px; margin: 0 auto; padding: 0 0 72px; display: flex; flex-direction: column; gap: 30px; }
.phead h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.phead p { margin: 6px 0 0; max-width: 640px; color: var(--muted); }

/* ---------- groups: a heading over a boxed list of rows */
.grp { display: flex; flex-direction: column; gap: 10px; }
.grp > h2 { margin: 0; padding: 0 4px; font-size: 14px; font-weight: 600; }
.grp > .gnote { margin: -4px 0 0; padding: 0 4px; font-size: 13.5px; color: var(--muted); }
.grp > .blocked { display: none; margin: 0; padding: 14px 20px; border: 1px dashed var(--line2); border-radius: 14px; font-size: 13.5px; color: var(--muted); }
.grp.dim > .panel { display: none; }
.grp.dim > .blocked { display: block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.panel > * { padding: 14px 20px; }
.panel > :not(:first-child) { border-top: 1px solid var(--line); }
.panel > .flush { padding: 0; }

/* ---------- rows, switches, sliders, choices */
.row { display: flex; align-items: center; gap: 10px 20px; min-height: 62px; margin: 0; cursor: pointer; }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .txt b { font-weight: 500; font-size: 15px; }
.row .txt small { color: var(--muted); font-size: 13px; }
.row.big .txt b { font-size: 16px; font-weight: 600; }
.panel > .row.sub { padding-left: 44px; }
.row.sub.dim { display: none; }
.dim { opacity: .45; }
.grp.dim { opacity: 1; }
.row.nocap { opacity: .45; cursor: default; }
.row .only { align-self: flex-start; margin-top: 2px; font-size: 11.5px; font-style: normal; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line2); color: var(--muted); }
.row.range, .row.choice, .row.multi { cursor: default; flex-wrap: wrap; }
.row.range .txt, .row.choice .txt { flex: 1 1 200px; }
.row.range .ctl { display: flex; align-items: center; gap: 14px; }
.row.range input { width: 220px; max-width: 100%; }
.row.range output { min-width: 74px; text-align: right; font-family: var(--mono); font-size: 13.5px; color: var(--soft); }
.row.multi { flex-direction: column; align-items: stretch; gap: 12px; }
.sw {
  appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 44px; height: 26px; margin: 0; border: 0; border-radius: 13px;
  background: var(--track); cursor: pointer; transition: background .15s;
}
.sw::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--knob); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s, background .15s;
}
.sw:checked { background: var(--accent); }
.sw:checked::after { transform: translateX(18px); background: var(--knob-on); }
.sw:disabled { cursor: default; }
input[type=range] { accent-color: var(--accent); cursor: pointer; margin: 0; }
input[type=range]:disabled { cursor: default; }
.picker { width: 44px; height: 32px; padding: 0; border: 1px solid var(--line2); border-radius: 8px; background: none; cursor: pointer; }
.pick, .seg, .chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* buttons: plain outline; pressed or primary = inverted; danger = red outline */
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border-radius: 9px;
  border: 1px solid var(--line2); background: transparent; color: var(--fg); font-size: 13.5px; white-space: nowrap;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="false"] { color: var(--soft); }
.chip[aria-pressed="true"], .chip.go { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip.danger { color: var(--bad); border-color: var(--bad-line); }
.chip.danger:hover { border-color: var(--bad); }
.chip:disabled { opacity: .4; cursor: default; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.warnbox { margin: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--warn-line); color: var(--soft); font-size: 13.5px; }
.warnbox b:first-child { color: var(--warn); font-weight: 600; }
.lbl { display: block; font-weight: 500; font-size: 15px; }
.sublbl { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.blk { display: flex; flex-direction: column; gap: 12px; }
.line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.line > input { flex: 1 1 220px; }
.line > label { flex: none; width: 80px; color: var(--soft); font-size: 13.5px; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.chev { flex: none; color: var(--muted); transition: transform .15s; }
details[open] .chev { transform: rotate(180deg); }
.panel > details { padding: 0; }
.panel > details > summary { display: flex; align-items: center; gap: 16px; min-height: 62px; padding: 14px 20px; }
.panel > details > summary .txt { flex: 1; min-width: 0; }
.panel > details > .body { display: flex; flex-direction: column; gap: 12px; padding: 0 20px 18px; }

/* ---------- appearance: accent swatches, eye styles, headphone cards, previews */
.swatches { display: flex; flex-direction: column; gap: 14px; }
.swatches .pick { gap: 6px 8px; }
.swb { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 66px; padding: 6px 4px; border: 0; border-radius: 10px; background: transparent; }
.swb i { width: 30px; height: 30px; border-radius: 50%; transition: box-shadow .15s; }
.swb span { font-size: 12.5px; color: var(--muted); }
.swb[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--fg); }
.swb[aria-pressed="true"] span { color: var(--fg); }
.swb:hover span { color: var(--fg); }
.eyes { display: flex; flex-direction: column; gap: 12px; }
.eyes.paused .styles { opacity: .45; }
.styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.styles .chip { display: block; height: auto; padding: 10px 12px; border-radius: 12px; text-align: left; white-space: normal; }
.styles .chip b { display: block; font-weight: 600; font-size: 14.5px; }
.styles .chip small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.styles .chip[aria-pressed="true"] { background: var(--active); color: var(--fg); border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.phones { display: flex; flex-direction: column; gap: 12px; }
.phones .styles .chip { padding: 8px; }
.phones .styles .chip .look { margin: 0 0 8px; }
.look { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; margin: 4px 0; border-radius: 10px; background: #000; border: 1px solid var(--line2); }
.look iframe { position: absolute; left: 0; top: 0; width: 640px; height: 360px; border: 0; transform-origin: 0 0; pointer-events: none; background: #000; }

/* ---------- gaze map */
.gaze { display: flex; flex-direction: column; gap: 10px; }
.gaze svg { display: block; width: 100%; height: auto; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); user-select: none; -webkit-user-select: none; }
.gaze.off svg { filter: grayscale(1); opacity: .35; pointer-events: none; }
.gaze .miss { display: none; }
.gaze.off .miss { display: block; }
.gaze.dim { display: none; }
.gaze .mon { fill: var(--panel); stroke: var(--line2); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.gaze .mon.pri { stroke: var(--muted); }
.gaze .lbl { fill: var(--soft); text-anchor: middle; font-family: var(--mono); }
.gaze .lbl.sub { fill: var(--muted); }
.gaze .body { fill: #000; stroke: var(--chip); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.gaze .scr { fill: #000; }
.gaze .eye { fill: var(--chip); }
.gaze .cur { fill: var(--fg); }
.gaze .grab { cursor: grab; touch-action: none; }
.gaze .grab.on { cursor: grabbing; }
.gaze .grab .hit { fill: transparent; }

/* ---------- sleep */
.sleephead { display: flex; flex-direction: column; gap: 14px; }
.sleephead .big { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
.sleephead .big b { font-family: var(--mono); font-weight: 500; font-size: 22px; }
.sleephead .big span { color: var(--muted); font-size: 13.5px; }
.timeline { position: relative; height: 30px; margin-bottom: 20px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); }
.timeline .span { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); }
.timeline .now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); z-index: 1; }
.timeline .ticks { position: absolute; left: 0; right: 0; top: 100%; display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--accent-soft); border: 1px solid var(--line2); }
.legend i.now { width: 2px; border: 0; border-radius: 0; background: var(--fg); }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.times label { display: flex; flex-direction: column; gap: 6px; color: var(--soft); font-size: 13px; }
.times input { font-family: var(--mono); font-size: 16px; }

/* ---------- dock */
.dockmock { display: flex; flex-wrap: wrap; gap: 10px; }
.pod { flex: 1 1 190px; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); }
.pod > small { color: var(--muted); font-size: 12.5px; }
.pod > div { display: flex; flex-wrap: wrap; gap: 6px; }
.pod .chip[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }

/* ---------- attention, AI agents, apps */
.attn ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.attn li { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; color: var(--soft); min-width: 0; }
.attn li time { flex: none; width: 66px; color: var(--muted); font-size: 12.5px; }
.attn li b { flex: none; font-weight: 600; color: var(--fg); }
.attn li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attn li.none { color: var(--muted); }
.attn .kind { flex: none; font-size: 11.5px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line2); color: var(--muted); }
.applist { display: flex; flex-direction: column; }
.applist:empty::before { content: "No apps yet. They show up here once they've sent a notification."; padding: 16px 20px; color: var(--muted); font-size: 13.5px; }
.applist > .none { padding: 16px 20px; color: var(--muted); font-size: 13.5px; }
.app { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; min-height: 64px; padding: 12px 20px; }
.app + .app { border-top: 1px solid var(--line); }
.app .nm { flex: 1 1 200px; min-width: 0; }
.app .nm b { display: block; font-weight: 500; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .nm small { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.app .ai { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line2); color: var(--soft); margin-left: 8px; vertical-align: 1px; }
.app select { flex: none; min-height: 36px; padding: 6px 10px; border-radius: 9px; background: var(--sunk); border: 1px solid var(--line2); color: var(--fg); font-size: 13.5px; }
.app select.set { border-color: var(--fg); }

/* ---------- weather place */
.place { display: flex; flex-direction: column; gap: 12px; }
.place .cur { margin: 0; color: var(--soft); font-size: 14.5px; }
.place .find { display: flex; flex-wrap: wrap; gap: 8px; }
.place .find input { flex: 1 1 240px; }
.place ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.place ul:empty { display: none; }
.place li button { width: 100%; justify-content: flex-start; }
.place li small { color: var(--muted); margin-left: 6px; }
.place .none { margin: 0; color: var(--muted); font-size: 13px; }

/* ---------- dictation */
.stt .cur { color: var(--muted); font-size: 13px; }
.stt .langs { max-height: 200px; overflow: auto; display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; }
.stt .langs .chip { min-height: 32px; padding: 4px 11px; font-size: 13px; }
.stt .langs .chip.off { opacity: .45; }
.stt .warn { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--warn-line); color: var(--soft); font-size: 13px; }
.stt .missing { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; opacity: .6; font-size: 12.5px; margin: 4px 0; }
.stt .missing b { font-weight: 500; flex: none; min-width: 130px; }
.stt code { font-size: 11.5px; color: var(--soft); word-break: break-all; user-select: all; }
.stt .res { display: block; color: var(--muted); font-size: 13px; }
.stt .res.ok { color: var(--good); }
.stt .res.bad { color: var(--bad); }

/* ---------- skins */
.mk .step { display: flex; flex-direction: column; gap: 12px; }
.mk h3 { display: flex; align-items: center; gap: 12px; margin: 0; font-size: 15px; font-weight: 500; }
.mk h3 i {
  flex: none; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--line2); font: 500 12.5px/1 var(--mono); font-style: normal; color: var(--soft);
}
.mk textarea {
  display: block; width: 100%; padding: 10px 12px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line2); color: var(--soft);
  font: 12.5px/1.45 var(--mono); resize: vertical;
}
.mk ol.howto { margin: 0; padding-left: 20px; color: var(--soft); font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.mk input[type=file] { max-width: 100%; color: var(--soft); font-size: 13.5px; }
.mk input[type=file]::file-selector-button {
  min-height: 36px; padding: 6px 14px; margin-right: 12px; border-radius: 9px; background: transparent; border: 1px solid var(--line2); color: var(--fg); cursor: pointer;
}
.mk .res-head { margin: 0; font-weight: 600; }
.mk .res-head.good { color: var(--good); }
.mk .res-head.bad { color: var(--bad); }
.mk ol.errs { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; color: var(--soft); }
.mk ol.errs code { color: var(--fg); font-size: 12px; overflow-wrap: anywhere; }
.mk ol.errs span, .mk ol.errs small { overflow-wrap: anywhere; }
.mk ol.errs small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
.mk details { color: var(--soft); font-size: 13px; }
.mk details summary { color: var(--muted); }
.mk details ul { margin: 6px 0 0; padding-left: 20px; overflow-wrap: anywhere; }
#mk-out { display: flex; flex-direction: column; gap: 10px; }
.skin-row { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 0; flex-wrap: wrap; }
.skin-row + .skin-row, .hp-maker + .skin-row, .skin-row + .hp-maker { border-top: 1px solid var(--line); }
.skin-row .txt { flex: 1; min-width: 140px; }
.skin-row b { display: block; font-weight: 500; font-size: 15px; overflow-wrap: anywhere; }
.skin-row small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.skin-row .tag { font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line2); color: var(--soft); }
.skin-row .ask { color: var(--bad); font-size: 13.5px; }
.skin-row input, .mk .name input { flex: 1; min-width: 140px; min-height: 36px; padding: 6px 10px; border-radius: 9px; background: var(--sunk); border: 1px solid var(--line2); color: var(--fg); max-width: 320px; }
.mk .name { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--soft); }
.hp-maker { display: flex; flex-direction: column; gap: 14px; padding: 14px 0 16px; }
.mk .empty { margin: 0; color: var(--muted); font-size: 13.5px; }

/* ---------- connections */
.conn.mask dd.sens, .conn.mask #conn-why, .conn.mask #conn-msg, .conn.mask #conn-nets, .conn.mask #conn-ip, .conn.mask #conn-pre, .conn.mask #conn-origin { filter: blur(6px); user-select: none; transition: filter .15s; }
.conn.mask #conn-ip::placeholder { color: transparent; }
.conn .st { display: flex; flex-direction: column; gap: 6px; }
.conn .st-head { display: flex; align-items: center; gap: 10px; }
.conn .st-head i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
.conn .st.up .st-head i { background: var(--good); }
.conn .st.wait .st-head i { background: var(--warn); }
.conn .st-head span { flex: 1; font-weight: 600; font-size: 17px; }
#conn-eye { background: transparent; border-color: var(--line2); color: var(--fg); }
#conn-eye:hover { border-color: var(--muted); }
.conn .st-why { margin: 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.conn .st-why:empty { display: none; }
.conn dl { display: grid; grid-template-columns: minmax(110px, 150px) minmax(0, 1fr); gap: 8px 16px; margin: 8px 0 0; padding: 12px 14px; border-radius: 10px;
  background: var(--sunk); border: 1px solid var(--line); font-size: 13.5px; }
.conn dl:empty { display: none; }
.conn dt { color: var(--muted); }
.conn dd { margin: 0; color: var(--fg); overflow-wrap: anywhere; }
.conn dd small { color: var(--muted); font-size: 12px; }
.conn dd code, .conn .cmd { font: 12.5px/1.45 var(--mono); color: var(--fg); }
.conn dd.good { color: var(--good); } .conn dd.warn { color: var(--warn); } .conn dd.bad { color: var(--bad); }
.conn pre { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); color: var(--soft);
  font: 12.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
.conn .ipline { display: flex; gap: 8px; flex: 1 1 260px; justify-content: flex-end; }
.conn .ipline input { flex: 1 1 auto; max-width: 240px; font-family: var(--mono); }
.conn input[type=number] { width: 140px; font-family: var(--mono); }
.conn .nets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.conn .nets .chip b { font-weight: 400; color: var(--muted); }
.conn .nets .none { color: var(--muted); font-size: 13.5px; }
.conn .row.netrow { flex-direction: column; align-items: stretch; gap: 12px; cursor: default; }
.conn .ask { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--bad-line); color: var(--soft); font-size: 13.5px; }
.conn .count { font-family: var(--mono); font-size: 18px; color: var(--fg); }
.conn .code { letter-spacing: .12em; font-family: var(--mono); }
.conn .step { margin: 0; color: var(--soft); font-size: 13.5px; }
.conn .cmdbox { padding: 10px 12px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line2); overflow-wrap: anywhere; user-select: all; }
#conn-wiz { display: flex; flex-direction: column; gap: 12px; }
#conn-wiz:empty { display: none; }

/* ---------- toast */
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: .2s; z-index: 9;
  max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px; background: var(--fg); color: var(--bg); font-size: 14px; box-shadow: 0 8px 28px var(--shadow);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { background: var(--bad); color: #fff; }
#reset.armed { background: var(--bad); border-color: var(--bad); color: #fff; }

@media (max-width: 820px) {
  .shell { flex-direction: column; align-items: stretch; }
  .side { position: static; width: auto; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; gap: 14px; }
  .navwrap { flex-direction: row; gap: 4px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; }
  .navgrp { display: contents; }
  .navlabel { display: none; }
  .nav { flex: none; white-space: nowrap; }
  .sidestatus { margin-top: 0; }
  .main { padding: 0 16px; }
  .topbar { padding-top: 12px; }
  .panel > * { padding-left: 16px; padding-right: 16px; }
  .panel > .row.sub { padding-left: 32px; }
  .times { grid-template-columns: 1fr; }
  .conn dl { grid-template-columns: 1fr; gap: 2px; }
  .conn dd { margin-bottom: 6px; }
}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <a class="brand" href="#appearance">
    <img class="only-dark" src="/logo/chip-dark.png" alt="Chip">
    <img class="only-light" src="/logo/chip-light.png" alt="Chip">
    <span><b>Settings</b><small>Your desk buddy</small></span>
  </a>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 0 0 0-13zM15.5 15.5L20 20"/></svg>
    <input type="search" id="nav-q" placeholder="Search settings" aria-label="Search settings" autocomplete="off" spellcheck="false">
  </label>
  <nav class="navwrap" id="nav" aria-label="Settings topics"></nav>
  <p class="nomatch" id="nav-none" hidden></p>
  <a class="sidestatus" href="#connections" title="Connections">
    <div class="status" id="status" role="status">
      <i class="dot"></i>
      <div><b id="st-main">Looking for Chip…</b><span id="st-sub"></span><span class="sync" id="st-sync"></span></div>
    </div>
  </a>
</aside>
<main class="main">
  <div class="topbar">
    <button type="button" class="themebtn" id="theme-btn">
      <svg class="only-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      <svg class="only-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <span id="theme-txt">Light</span>
    </button>
  </div>
  <div id="pages"></div>
</main>
</div>
<div id="toast" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------------------------------------------------------------- pages
  // One page per topic, each a list of groups (a heading over a boxed list of rows). A group with `needs` is replaced by
  // a line saying what to turn on while that switch is off; a row with `needs` is indented under the switch it depends on
  // and hidden while it is off. Every input keeps its data-k / id, so the code further down finds it on any page.
  const sw = (k, label, help = "", needs = "") => ({ k, label, help, needs });
  const big = (k, label, help) => ({ k, label, help, needs: "", big: true });
  const range = (k, label, min, max, step, unit, needs = "", unless = false) => ({ k, label, min, max, step, unit, needs, unless, range: true });
  const choice = (k, label, help, options, needs = "") => ({ k, label, help, options, needs });  // a row of buttons, one per value
  const raw = (html) => ({ raw: html });
  const IDLE = [["curious", "Curious"], ["happyBlip", "Happy"], ["suspicious", "Suspicious"], ["look", "Look around"],
    ["wink", "Wink"], ["whistle", "Whistle"], ["sneeze", "Sneeze"], ["peek", "Peek"], ["spin", "Spin"],
    ["wiggle", "Wiggle"], ["smirkBlip", "Smirk"], ["yawn", "Yawn (away)"], ["bored", "Bored (away)"], ["nod", "Nod off (away)"]];
  const SWATCHES = [["cyan", "Cyan", "#2ee6f2"], ["terracotta", "Terracotta", "#ee9358"], ["sage", "Sage", "#b4d38c"], ["violet", "Violet", "#a78bfa"],
    ["rose", "Rose", "#f472b6"], ["amber", "Amber", "#f5c04a"], ["sky", "Sky", "#6cb8ff"], ["custom", "Custom", "var(--custom)"]];
  const CHEV = `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6-6"/></svg>`;
  const summary = (title, sub) => `<summary><span class="txt"><b class="lbl">${title}</b><small class="sublbl">${sub}</small></span>${CHEV}</summary>`;
  const TS = (title, sub, fix) => `<details>${summary(esc(title), esc(sub))}<div class="body"><p class="hint" style="color:var(--soft);font-size:14px">${fix}</p></div></details>`;
  const turnOn = (what, page) => `Turn on ${what}${page ? ` on the <a href="#${page}">${page[0].toUpperCase() + page.slice(1)}</a> page` : " above"} to change these.`;

  // the bits of markup the code below fills in (all text from the pack, the bridge or the user goes in via esc() or textContent)
  const SWATCH_HTML = `<div class="swatches"><span><b class="lbl">Accent colour</b><small class="sublbl">Eyes, glow and every colour in the pack's art, derived from this one</small></span>` +
    `<div class="pick" role="group" aria-label="Accent colour">` + SWATCHES.map(([v, label, c]) =>
      `<button class="swb" data-k="accent" data-v="${v}" aria-pressed="false"><i style="background:${c}"></i><span>${label}</span></button>`).join("") + `</div></div>`;
  const EYES_HTML = `<div class="eyes" id="eyes"><span><b class="lbl">Eye style</b><small class="sublbl">The looks in Chip's pack</small></span>` +
    `<p class="warnbox" id="eyes-skin" hidden><b>A custom skin is on,</b> so Chip's own looks are paused. Use “Back to Chip's own look” on the <a href="#skins">Skins</a> page to switch them on again.</p>` +
    `<div class="styles" id="eye-styles"></div></div>`;
  const PUPIL_HTML = `<div class="row choice sub" id="pupil-row" hidden><span class="txt"><b>Pupil size</b><small>The dark centre that follows your cursor</small></span>` +
    `<div class="pick" id="pupil-pick"></div></div>`;
  const PHONES_HTML = `<div class="phones" id="phones"><span><b class="lbl">Default headphones</b>` +
    `<small class="sublbl">Worn when following is off, or when the skin has no headphones of its own</small></span><div class="styles" id="phones-pick"></div></div>`;
  // the monitor setup (filled in by the gaze map code): hidden with the mouse-follow toggle off, and with pupils off
  const GAZE_HTML = `<div class="gaze off" id="gaze" data-needs="showPupils"><span><b class="lbl">Where the phone sits</b>` +
    `<small class="sublbl">Arrange your screens in Settings, Displays the way they sit on your desk, then drag Chip to where the phone really is.</small></span>` +
    `<p class="warnbox miss"><b>The GNOME extension isn't running.</b> Run laptop/install.sh, then log out and back in.</p>` +
    `<svg id="gaze-map" role="img" aria-label="Your screens and where the phone sits"></svg></div>`;
  const SLEEP_HTML = `<div class="sleephead">` +
    `<div class="big"><b id="sl-range">11:00 PM → 6:30 AM</b><span id="sl-len"></span></div>` +
    `<div class="timeline" id="timeline" aria-hidden="true"><i class="now" id="tl-now"></i>` +
    `<div class="ticks"><span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span><span>12 AM</span></div></div>` +
    `<div class="legend" aria-hidden="true"><span><i></i>Asleep</span><span><i class="now"></i>Now</span></div>` +
    `<div class="times"><label>Goes to sleep<input type="time" class="field" data-k="sleepAt" required></label>` +
    `<label>Wakes up<input type="time" class="field" data-k="wakeAt" required></label></div>` +
    `<div class="chips" id="presets" role="group" aria-label="Sleep presets"></div></div>`;
  const DOCK = [
    ["Time & outside", [["dockTime", "Time"], ["dockWeather", "Weather"], ["dockAqi", "AQI"]]],
    ["Laptop", [["dockCpu", "CPU"], ["dockLaptopTemp", "Temp"], ["dockLaptopBattery", "Battery"]]],
    ["Phone", [["dockPhoneBattery", "Battery"], ["dockPhoneTemp", "Temp"]]],
  ];
  const DOCK_HTML = `<div class="dockmock">` + DOCK.map(([name, items]) =>
    `<div class="pod" role="group" aria-label="${name}"><small>${name}</small><div>` +
    items.map(([k, label]) => `<button class="chip" data-k="${k}" aria-pressed="true">${label}</button>`).join("") +
    `</div></div>`).join("") + `</div>`;
  const PLACE_HTML = `<div class="place"><p class="cur" id="place-cur"></p><form class="find" id="place-form">` +
    `<input type="search" class="field" id="place-q" placeholder="Search a city, e.g. Mumbai" autocomplete="off" aria-label="Search for a city">` +
    `<button class="chip go" id="place-go">Search</button></form><ul id="place-res"></ul><p class="none" id="place-none" hidden></p>` +
    `<div class="acts"><button class="chip" id="place-reset" type="button">Use the default place</button></div></div>`;
  const SKIN_STEPS = `<div class="step"><h3><i>1</i>Make a face for any character</h3>` +
    `<ol class="howto"><li>Click <b>Copy prompt</b> below.</li>` +
    `<li>Paste it into any AI chat (ChatGPT, Gemini, Claude…).</li>` +
    `<li>Under it, describe your character, pet or yourself, and attach any pictures or art. Name it if you like.</li>` +
    `<li>Download the JSON file the AI makes (or copy its code block).</li>` +
    `<li>Upload it in step 2, check it, then click <b>Use on Chip</b>.</li></ol>` +
    `<textarea id="mk-prompt" readonly rows="6" aria-label="Master prompt for your AI chat">Loading the prompt…</textarea>` +
    `<div class="acts"><button class="chip go" id="mk-copy" disabled>Copy prompt</button></div>` +
    `<p class="hint">Works for phones and tablets, landscape or portrait. Your photos go only to that chatbot; Chip only receives the finished JSON.</p></div>` +
    `<div class="step"><h3><i>2</i>Upload the result</h3><input type="file" id="mk-file" accept=".json,application/json,text/plain" aria-label="Skin JSON file">` +
    `<textarea id="mk-paste" rows="3" spellcheck="false" placeholder="…or paste the JSON your AI sent" aria-label="Paste the skin JSON"></textarea>` +
    `<div class="acts"><button class="chip" id="mk-check">Check it</button></div></div>` +
    `<div class="step" id="mk-result" hidden><h3><i>3</i>Result</h3><div id="mk-out"></div></div>`;
  const SKIN_LIST = `<div class="blk"><div id="mk-list"></div><div class="acts"><button class="chip" id="mk-own">Back to Chip's own look</button></div></div>`;
  const STT_ENGINES = `<p class="hint">Phone: offline, about 6 s a sentence, and the laptop stays free. Laptop: offline, about 2 s, with a bigger model. ` +
    `Cloud API: the fastest, but your audio goes to the provider.</p>`;
  const STT_PHONE = `<p class="hint" data-stt-show="phone">Needs the phone's speech engine: once, in Termux on the phone, run <code>bash ~/deskbuddy/stt-setup.sh</code> ` +
    `(about 10 minutes, optional). Without it, pick Laptop or Cloud API.</p>`;
  const STT_LANG = `<div class="blk"><span><b class="lbl">Language</b><small class="sublbl cur" id="stt-cur"></small></span>` +
    `<label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 0 0 0-13zM15.5 15.5L20 20"/></svg>` +
    `<input type="search" id="stt-q" placeholder="Search languages, e.g. Hindi or ja" autocomplete="off" aria-label="Search languages" style="background:var(--sunk)"></label>` +
    `<div class="langs" id="stt-langs"></div><div class="warn" id="stt-warn" hidden></div></div>`;
  const STT_LAPTOP = `<div class="blk"><span><b class="lbl">Model</b><small class="sublbl">Bigger models understand more but are slower. Automatic uses small, or base in fast mode.</small></span>` +
    `<div class="seg" id="stt-models"></div><div id="stt-missing"></div></div>`;
  const STT_CLOUD = `<div class="blk"><span><b class="lbl">Provider</b></span><div class="seg" id="stt-providers"></div>` +
    `<div id="stt-model-pick" class="seg"></div>` +
    `<div class="line" id="stt-model-free" hidden><label for="stt-model">Model</label><input type="text" class="field" id="stt-model" placeholder="e.g. whisper-1" autocomplete="off" spellcheck="false"></div>` +
    `<div class="line" id="stt-url-row" hidden><label for="stt-url">Base URL</label><input type="text" class="field" id="stt-url" placeholder="https://my-server.example/v1" autocomplete="off" spellcheck="false"></div>` +
    `<small class="res bad" id="stt-url-bad" hidden>The URL must start with https://</small>` +
    `<div class="line" id="stt-region-row" hidden><label for="stt-region">Region</label><input type="text" class="field" id="stt-region" placeholder="e.g. westeurope" autocomplete="off" spellcheck="false"></div></div>` +
    `<div class="blk"><div class="line"><label for="stt-key">API key</label><input type="password" class="field" id="stt-key" placeholder="Paste a key to replace it" autocomplete="new-password" spellcheck="false">` +
    `<button class="chip go" id="stt-save">Save</button><button class="chip" id="stt-clear">Clear</button></div>` +
    `<small class="res" id="stt-keystate"></small>` +
    `<p class="hint">Keys are kept only on this laptop (<code>~/.config/deskbuddy/secrets.json</code>, owner-only) and are never sent to the phone or shown again.</p></div>`;
  const STT_TEST = `<div class="row"><span class="txt"><b>Test the engine</b><small class="priv" id="stt-priv"></small></span>` +
    `<span class="res" id="stt-res"></span><button class="chip" id="stt-test">Test</button></div>`;
  const ATTN_TRY = `<div class="row"><span class="txt"><b>Test the alert</b><small>Blinks and plays the sound once, the way a real alert would</small></span>` +
    `<button class="chip" id="torch-test">Test</button></div>` +
    `<div class="attn"><b class="lbl">Recent alerts</b><ul id="attn-log"><li class="none">No alerts yet</li></ul></div>`;
  // the Connections page: link status, actions, the pairing wizard (all dynamic text goes through esc() or textContent)
  const CONN_TOP = `<div class="blk"><p class="warnbox" id="conn-origin" hidden></p>` +
    `<div class="st" id="conn-st"><div class="st-head"><i></i><span id="conn-main">Checking…</span>` +
    `<button class="chip" id="conn-eye" aria-pressed="true">Show details</button></div>` +
    `<p class="st-why" id="conn-why"></p><dl id="conn-dl"></dl></div>` +
    `<div class="acts"><button class="chip" id="conn-reconnect">Reconnect</button><button class="chip" id="conn-find">Find phone</button>` +
    `<button class="chip" id="conn-checks">Run checks</button></div>` +
    `<p class="hint" id="conn-msg" hidden></p><pre id="conn-pre" hidden></pre></div>` +
    `<div class="row range"><label class="txt" for="conn-ip"><b>Phone's address</b><small>Set it by hand when Find phone can't see it</small></label>` +
    `<span class="ipline"><input type="text" class="field" id="conn-ip" inputmode="decimal" placeholder="e.g. 192.168.1.9" autocomplete="off" spellcheck="false">` +
    `<button class="chip" id="conn-setip">Set IP</button></span></div>`;
  const CONN_NETS = `<div class="row netrow sub" data-needs="linkHomeOnly"><span class="txt"><b>Home networks</b>` +
    `<small>Chip only connects (and only scans) on these. “wired” means a cable. Up to 10.</small></span>` +
    `<div class="nets" id="conn-nets"></div></div>`;
  // what to do on the phone itself, shown before and during pairing and after it
  const PHONE_PREP = `<p class="step"><b>First, on the new phone:</b> install <a href="https://f-droid.org/packages/com.termux/" target="_blank" rel="noopener">Termux</a> ` +
    `and <a href="https://f-droid.org/packages/com.termux.api/" target="_blank" rel="noopener">Termux:API</a> from F-Droid (the same source for both: mixing sources breaks them; the Play Store's Termux is outdated). ` +
    `Open Termux once, then do step 1 below.</p>`;
  const PHONE_FACE = `<p class="step"><b>Then on the phone:</b> open <code>http://127.0.0.1:8080</code> in Chrome, then ⋮ → <b>Install app</b> (or “Add to Home screen”). ` +
    `Chip then opens full screen and keeps the screen on while it shows. Switch on <b>Personal phone</b> above if it's a phone you also use. ` +
    `Open Termux to start Chip (or type <code>chip-start</code>); type <code>chip-stop</code>, or tap Exit in Termux's notification, to stop it. ` +
    `An always-on phone can use Termux:Boot and kiFOSSk instead.</p>`;
  const CONN_END = `<details id="conn-adv">${summary("Phone's ssh port", "Only change it if you moved sshd in Termux")}<div class="body">` +
    `<p class="warnbox"><b>Careful.</b> A wrong port stops the tunnel, and nothing here can fix it from the phone. Use the port you gave <code>sshd -p</code>, from 1024 to 65535.</p>` +
    `<div class="line"><label for="conn-port">Port</label><input type="number" class="field" id="conn-port" min="1024" max="65535" step="1" inputmode="numeric">` +
    `<button class="chip" id="conn-port-save">Save</button></div></div></details>` +
    `<details id="conn-rep">${summary("Replace phone", "Pair a different phone with this laptop")}<div class="body">` +
    `<p class="hint">The new phone is trusted only after you type the code it shows. Do this on your home Wi-Fi.</p>` +
    `<div id="conn-forget"><button class="chip danger" id="conn-forget-btn">Forget this phone…</button></div><div id="conn-ask" hidden></div>` +
    `<div id="conn-wiz"></div></div></details>`;
  const THEME_HTML = `<div class="row choice"><span class="txt"><b>Theme</b><small>Pitch black or light, for this page only. Chip's face on the phone is not affected</small></span>` +
    `<div class="pick" id="theme-pick" role="group" aria-label="Theme"><button class="chip" data-theme-pick="system">System</button>` +
    `<button class="chip" data-theme-pick="light">Light</button><button class="chip" data-theme-pick="dark">Dark</button></div></div>`;
  const STORE_HTML = `<div class="blk"><span><b class="lbl">Saved on this laptop</b><small class="sublbl">The drawer toggles on the phone stay in sync with this page.</small></span>` +
    `<code style="align-self:flex-start;padding:6px 10px;border-radius:8px;background:var(--sunk);border:1px solid var(--line);overflow-wrap:anywhere">~/.config/deskbuddy/settings.json</code></div>`;

  const looks = [], LOOK_CYCLE = [[0, 0], [-1, 0], [1, 0], [0, -1]];
  let lookStep = 0, lookTick = 0;
  function aim(frame, [x, y]) {
    try {
      const st = frame.contentDocument.getElementById("face").style;
      st.setProperty("--lx", (x * 7).toFixed(2) + "vmin"); st.setProperty("--ly", (y * 5).toFixed(2) + "vmin"); st.setProperty("--near", "0");

    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) return connMsg("Type an IPv4 address like 192.168.1.9", "bad");
    const { status, data } = await linkPost("/link/ip", { ip });
    connMsg(status === 200 ? `Using ${data.ip}: it presented the pinned key.` : data.error === "key mismatch" ? `${ip} answers, but not with the pinned phone key, so it was refused.` : why(data), status === 200 ? "good" : "bad");
    if (status === 200) $("#conn-ip").value = "";
    loadPhone();
  }));
  $("#conn-ip").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#conn-setip").click(); });
  $("#conn-port-save").addEventListener("click", () => {
    const n = Number($("#conn-port").value);
    if (!Number.isInteger(n) || n < 1024 || n > 65535) return connMsg("The port must be a whole number from 1024 to 65535", "bad");
    save({ sshPort: n });
  });
  $("#conn-nets").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || !S) return;
    if (b.id === "conn-addnet") {
      const here = linkInfo && linkInfo.laptop && linkInfo.laptop.ssid;
      if (here && !S.linkNetworks.includes(here)) save({ linkNetworks: [...S.linkNetworks, here] });
    } else if (b.dataset.net) save({ linkNetworks: S.linkNetworks.filter((n) => n !== b.dataset.net) });
  });

  // ---- inline confirm (no alert())
  function ask(text, yes, onYes, danger = true) {
    const box = $("#conn-ask");
    box.hidden = false;
    box.className = "ask";
    box.innerHTML = `<div>${esc(text)}</div><div class="acts"><button class="chip ${danger ? "danger" : "go"}" id="ask-yes">${esc(yes)}</button><button class="chip" id="ask-no">Cancel</button></div>`;
    $("#ask-no").onclick = () => { box.hidden = true; };
    $("#ask-yes").onclick = async () => { box.hidden = true; await onYes(); };
  }
  $("#conn-forget-btn").addEventListener("click", () => ask(
    "Forget this phone? The pinned ssh key and saved address are deleted and the tunnel stops. Chip shows nothing until a phone is paired again.",
    "Yes, forget it", async () => {
      const { status, data } = await linkPost("/link/forget");
      connMsg(status === 200 ? "Forgotten. Pair a phone below." : why(data), status === 200 ? "good" : "bad");
      loadPhone();
    }));

  // ---- pairing wizard
  async function loadPair() {
    const r = await fetch("/link/pair", { cache: "no-store" }).then((x) => (x.ok ? x.json() : null)).catch(() => null);
    if (!r) return;
    pair = r; pairAt = Date.now();
    renderWiz();
  }
  function renderWiz() {
    const wiz = $("#conn-wiz"), p = pair || { active: false };
    const sig = JSON.stringify([pairResult, wizMsg, p.active, p.expired, p.serving, p.script_by, p.fetched_by, p.candidate, p.wrong_codes, p.error, p.command, p.firewall]);
    if (sig === wizSig) return updateCount();
    const keep = $("#wiz-code") ? $("#wiz-code").value : "";
    wizSig = sig;
    const msg = wizMsg ? `<p class="hint" style="color:${wizMsg.bad ? "var(--bad)" : "var(--good)"}">${esc(wizMsg.text)}</p>` : "";
    let h = "";
    if (pairResult) {
      const r = pairResult;
      h = `<p class="step"><b style="color:var(--good)">✓ Paired with ${esc(r.ip)}</b><br><small>Key ${esc(shortFp(r.fingerprint))}</small></p>` +
        `<p class="step">${r.deploy.ok ? "Chip's files were sent to the new phone." : "The key is pinned, but sending Chip's files failed. Run ./deploy.sh on the laptop:"}</p>` +
        (r.deploy.ok ? PHONE_FACE : `<pre>${esc((r.deploy.lines || []).join("\n"))}</pre>`) +
        `<div class="acts"><button class="chip go" id="wiz-done">Done</button></div>`;
    } else if (!p.active) {
      h = (p.expired ? `<p class="hint">The last pairing ran out of time.</p>` : "") + PHONE_PREP +
        `<p class="step">Pairing opens a one-time download on this laptop for 10 minutes, for one phone only. Nothing is trusted until you type the code the phone shows.</p>` +
        (CAPS && CAPS.os && CAPS.os !== "linux" ? `<p class="hint">Your computer may ask to allow Python on the network: allow it (private networks).</p>` : "") +
        `<div class="acts"><button class="chip go" id="wiz-start">Start pairing</button></div>` + msg;
    } else {
      const fw = p.firewall && p.firewall.match(/^(.*?pairing only), (sudo .*?)\s+\(after: (sudo .*)\)$/);
      h = `<p class="step">Expires in <span class="count" id="conn-count"></span></p>` + (p.serving ? PHONE_PREP : "");
      if (p.serving) {
        h += `<p class="step"><b>1.</b> In Termux on the new phone, paste this one line (it checks the script before running it):</p>` +
          `<div class="cmdbox cmd" id="wiz-cmd">${esc(p.command)}</div><div class="acts"><button class="chip" id="wiz-copy">Copy command</button></div>`;
        if (p.firewall) h += `<div class="warnbox"><b>Firewall.</b> The laptop's firewall blocks the phone from this port. Allow it for this pairing only:` +
          (fw ? `<div class="cmdbox cmd" style="margin-top:6px">${esc(fw[2])}</div>Then remove it afterwards:<div class="cmdbox cmd" style="margin-top:6px">${esc(fw[3])}</div>` : `<div class="cmdbox cmd">${esc(p.firewall)}</div>`) + `</div>`;
        h += `<p class="step">${p.script_by ? `${esc(p.script_by)} got the script and is fetching the files…` : "Waiting for the phone to run the command…"}</p>`;
      } else if (p.fetched_by) {
        const c = p.candidate;
        h += `<p class="step">${c && c.ready ? `✓ ${esc(p.fetched_by)} finished setup and its ssh is up.` : `Setup is running on ${esc(p.fetched_by)} (installing packages, a few minutes)…`}</p>` +
          `<p class="step"><b>2.</b> When it ends, the phone prints <b>PAIRING CODE</b> (4 groups of 4). Type it here. The laptop doesn't show the phone's key on purpose, so a look-alike device can't be approved by mistake.</p>` +
          `<div class="line"><input type="text" id="wiz-code" class="code" maxlength="24" placeholder="xxxx xxxx xxxx xxxx" autocomplete="off" spellcheck="false" aria-label="Pairing code from the phone">` +
          `<button class="chip go" id="wiz-confirm">Pin this phone</button></div>` +
          (p.wrong_codes ? `<p class="hint" style="color:var(--bad)">${p.wrong_codes} of 5 wrong codes used. The fifth ends pairing.</p>` : "");
      }
      if (p.error) h += `<div class="warnbox">${esc(p.error)}</div>`;
      h += msg + `<div class="acts"><button class="chip danger" id="wiz-cancel">Cancel pairing</button></div>`;
    }
    wiz.innerHTML = h;
    if (keep && $("#wiz-code")) $("#wiz-code").value = keep;
    updateCount();
  }
  function updateCount() {
    const el = $("#conn-count");
    if (!el || !pair || !pair.active) return;
    const left = Math.max(0, Math.round(pair.expires_in - (Date.now() - pairAt) / 1000));
    el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    if (left === 0 && Date.now() - pairAt > 1500) loadPair();
  }
  async function startPair(replace) {
    wizMsg = null;
    const { status, data } = await linkPost("/link/pair/start", replace ? { replace: true } : {});
    if (status !== 200) wizMsg = { bad: true, text: data.message || WHY[data.error] || data.error || "couldn't start pairing" };
    pairResult = null; wizSig = ""; await loadPair(); renderWiz();
  }
  $("#conn-wiz").addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "wiz-start") {
      if (linkInfo && linkInfo.pinned && linkInfo.tunnel) {
        ask("A phone is connected right now. Starting doesn't disconnect it: the new phone replaces it only after you type its code. Start anyway?",
          "Yes, pair another", () => startPair(true), false);
      } else startPair(false);
    } else if (b.id === "wiz-copy") {
      try { await navigator.clipboard.writeText(pair.command); b.textContent = "Copied ✓"; }
      catch (err) { const r = document.createRange(); r.selectNodeContents($("#wiz-cmd")); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = "Selected: press Ctrl+C"; }
      setTimeout(() => { if (b.isConnected) b.textContent = "Copy command"; }, 2500);
    } else if (b.id === "wiz-cancel") {
      await linkPost("/link/pair/cancel"); wizMsg = null; wizSig = ""; await loadPair(); renderWiz();
    } else if (b.id === "wiz-done") {
      pairResult = null; wizMsg = null; wizSig = ""; loadPhone(); loadPair();
    } else if (b.id === "wiz-confirm") {
      const code = $("#wiz-code").value.trim();
      if (code.replace(/\s+/g, "").length < 16) { wizMsg = { bad: true, text: "Type all 16 characters the phone shows." }; wizSig = ""; return renderWiz(); }
      await busy(b, "Pinning & sending files…", async () => {
        const { status, data } = await linkPost("/link/pair/confirm", { code });
        if (status === 200) { pairResult = data; wizMsg = null; }
        else wizMsg = { bad: true, text: data.error === "code mismatch" ? `That code doesn't match the phone at ${pair.fetched_by}. ${data.tries_left} tries left.`
          : data.error === "no candidate" ? "The phone isn't ready yet: setup is still running." : data.message || data.error };
      });
      wizSig = ""; await loadPair(); renderWiz();
    }
  });
  $("#conn-rep").addEventListener("toggle", () => { if ($("#conn-rep").open) loadPair(); });
  setInterval(updateCount, 1000);

  loadSettings(); loadCaps(); loadPhone(); loadAttention(); loadAgents();
  setInterval(loadAttention, 4000);
  setInterval(loadSettings, 4000);
  setInterval(loadPhone, 2000);
  setInterval(() => { if (S) renderSleep(); }, 30000);
})();
</script>
</body>
</html>
