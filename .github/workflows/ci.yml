name: ci
on:
  push:
    branches: [port, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install asyncssh==2.24.1
      - run: python -I -m py_compile laptop/bridge.py laptop/link.py laptop/sshlink.py laptop/deploy.py laptop/doctor.py laptop/selftest.py phone/server.py phone/alert.py phone/dictation.py
      - run: node laptop/check_pack.js
      - run: python -I laptop/test_skins.py
      - run: python -I laptop/selftest.py
      - run: python -I laptop/tests/test_link.py
      - run: python3 -I laptop/tests/test_hooks.py
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r laptop/requirements.txt asyncssh==2.24.1
      - run: python -I -X utf8 -m py_compile laptop/bridge.py laptop/link.py laptop/sshlink.py laptop/deploy.py laptop/doctor.py laptop/selftest.py laptop/install.py laptop/tests/test_macos.py phone/server.py phone/alert.py phone/dictation.py
      - run: python -I -X utf8 laptop/selftest.py
        env:
          CHIP_EXPECT_CAPS: stats,idle,locked,typing
      - run: python -I -X utf8 laptop/tests/test_link.py
      - run: python -I -X utf8 laptop/tests/test_hooks.py
      # S5: the Windows installer, the bridge it starts, typing into a real window, then the uninstall
      - name: Windows - install.py --ci
        if: runner.os == 'Windows'
        shell: bash
        run: python -I -X utf8 laptop/install.py --ci
      - name: Windows - install.py --ci again (stops the running Chip, starts it afresh)
        if: runner.os == 'Windows'
        shell: bash
        run: python -I -X utf8 laptop/install.py --ci
      - name: Windows - the bridge answers, Chip starts at login
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $s = Invoke-RestMethod http://127.0.0.1:8765/stats
          $s.caps | ConvertTo-Json
          if (-not $s.caps.stats -or $null -eq $s.ram -or $null -eq $s.uptime) { throw "the bridge has no PC stats" }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Chip
          Write-Host "Run entry: $run"
          if ($run -notmatch 'pythonw\.exe.*supervise\.py') { throw "no start-at-login entry" }
      - name: Windows - typing into Notepad
        if: runner.os == 'Windows'
        shell: bash
        run: |
          code=0
          python -I -X utf8 laptop/tests/test_typing_windows.py || code=$?
          if [ "$code" = 77 ]; then echo "::warning::no usable desktop on this runner: typing into Notepad was not tested"; exit 0; fi
          exit $code
      - name: Windows - typing into a Tk text box
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          code=0
          python -I -X utf8 laptop/tests/test_typing_windows.py --app tk || code=$?
          if [ "$code" = 77 ]; then echo "::warning::no usable desktop on this runner: typing into Tk was not tested"; exit 0; fi
          exit $code
      - name: Windows - install.py --uninstall
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: python -I -X utf8 laptop/install.py --uninstall
      - name: Windows - Chip is gone
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Chip) { throw "the Run entry is still there" }
          try { Invoke-RestMethod http://127.0.0.1:8765/caps -TimeoutSec 3 | Out-Null; throw "the bridge still answers" } catch { if ($_.Exception.Message -eq "the bridge still answers") { throw } }
      - name: Windows - bridge log
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: Get-Content "$HOME\.local\share\deskbuddy\bridge.log" -Tail 80 -ErrorAction SilentlyContinue
      # S6: the macOS backend without permissions (ctypes read-back), the installer + LaunchAgent, then the uninstall
      - name: macOS - ctypes checks (key events read back, idle, lock, caps)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python -I -X utf8 laptop/tests/test_macos.py
      - name: macOS - install.py --ci
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python -I -X utf8 laptop/install.py --ci
      - name: macOS - install.py --ci again (boots the old LaunchAgent out, loads it afresh)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python -I -X utf8 laptop/install.py --ci
      - name: macOS - the bridge answers, the LaunchAgent is loaded
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          curl -sf -m 10 http://127.0.0.1:8765/stats | python -I -c '
          import json, sys
          s = json.load(sys.stdin)
          print(json.dumps(s["caps"]), "ram", s["ram"], "uptime", s["uptime"], "load", s["load"], "idle_ms", s["idle_ms"], "locked", s["locked"])
          assert s["caps"]["stats"] and s["ram"] is not None and s["uptime"] is not None, "the bridge has no PC stats"
          assert s["caps"]["typing"] and isinstance(s["locked"], bool), "no lock state: typing would be refused"'
          plutil -p ~/Library/LaunchAgents/org.deskbuddy.bridge.plist
          launchctl print gui/$(id -u)/org.deskbuddy.bridge | grep -E 'state|pid|program' | head
      - name: macOS - install.py --uninstall
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: python -I -X utf8 laptop/install.py --uninstall
      - name: macOS - Chip is gone
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: |
          test ! -e ~/Library/LaunchAgents/org.deskbuddy.bridge.plist || { echo "the plist is still there"; exit 1; }
          if launchctl print gui/$(id -u)/org.deskbuddy.bridge >/dev/null 2>&1; then echo "the LaunchAgent is still loaded"; exit 1; fi
          if curl -s -m 3 http://127.0.0.1:8765/caps >/dev/null; then echo "the bridge still answers"; exit 1; fi
      - name: macOS - bridge log
        if: failure() && runner.os == 'macOS'
        run: tail -n 80 ~/Library/Logs/deskbuddy-bridge.log || true
