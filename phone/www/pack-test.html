<!doctype html>
<meta charset="utf-8">
<title>Chip pack player (dev)</title>
<style>html,body{margin:0;height:100%;background:#000;display:grid;place-items:center}</style>
<canvas id="c"></canvas>
<script src="pack.js"></script>
<script src="player.js"></script>
<script>
  // ?mood=happy&accent=%23ee9358&music&badAir&gaze=0.5,-1&eyes=toon&pupil=L&t=1.5&clip=wink  (t freezes time; budget = no loop)
  // &skin=<id|draft> loads that skin from the bridge (same origin) over the pack
  const q = new URLSearchParams(location.search);
  ChipPack.load("pack.json").then(async (pack) => {
    let skin = null;
    if (q.get("skin")) {
      skin = await (await fetch("/skins/" + (q.get("skin") === "draft" ? "draft" : encodeURIComponent(q.get("skin"))) + ".json")).json();
      ChipPack.setSkin(skin);
    }
    const p = ChipPlayer(pack, document.getElementById("c"));
    p.setEyes(skin ? "skin:" + skin.id : q.get("eyes"), q.get("pupil"));
    ChipPack.setAccent(q.get("accent") || (skin && skin.accent) || "#2ee6f2");
    p.setMood(q.get("mood") || "neutral");
    p.setSignals({ music: q.has("music"), badAir: q.has("badAir"), night: q.has("night") });
    if (q.get("clip")) p.play(q.get("clip"));
    if (q.has("t")) p.freeze(+q.get("t"));
    if (q.get("gaze")) p.setGaze(...q.get("gaze").split(",").map(Number), q.has("near"));
    if (!q.has("budget")) p.start();   // ?budget: laptop/check_budget.js steps the player itself
    window.chip = p;
  });
</script>
